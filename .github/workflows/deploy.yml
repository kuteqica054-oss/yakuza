name: Deploy yakuzablade.com.tr to Hostinger

# Runs on every push to main (and manually from the Actions tab).
# Builds the Astro site and uploads dist/ to the hosting over SSH.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   YAKUZA_SSH_HOST      e.g. 45.84.204.200
#   YAKUZA_SSH_PORT      e.g. 65002
#   YAKUZA_SSH_USER      e.g. u514346694
#   YAKUZA_SSH_PASSWORD  hosting SSH password
# Optional variable (Settings → Secrets and variables → Actions → Variables):
#   YAKUZA_DEPLOY_PATH   default: domains/yakuzablade.com.tr/public_html  (relative to the SSH home dir)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yakuza
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.YAKUZA_DEPLOY_PATH || 'domains/yakuzablade.com.tr/public_html' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check secrets
        env:
          SSH_HOST: ${{ secrets.YAKUZA_SSH_HOST }}
          SSH_USER: ${{ secrets.YAKUZA_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.YAKUZA_SSH_PASSWORD }}
        run: |
          for v in SSH_HOST SSH_USER SSH_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret YAKUZA_$v is not set"; exit 1; }
          done

      - name: Upload over SSH
        env:
          SSHPASS: ${{ secrets.YAKUZA_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.YAKUZA_SSH_HOST }}
          SSH_PORT: ${{ secrets.YAKUZA_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.YAKUZA_SSH_USER }}
        run: |
          sudo apt-get install -y -qq sshpass rsync >/dev/null
          SSH="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          # Upload/overwrite site files. Files that exist only on the server are kept
          # (no --delete) so nothing unrelated in public_html is ever removed.
          rsync -az --stats -e "$SSH" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          $SSH "$SSH_USER@$SSH_HOST" "ls -la '$DEPLOY_PATH' | head -30"

      - name: Smoke test live site
        run: |
          sleep 5
          for u in / /en/ /anahtar-teslim/ /en/turnkey/ /og/tr.png /sitemap.xml; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "https://yakuzablade.com.tr$u" || true)
            echo "$code https://yakuzablade.com.tr$u"
          done
          echo "--- title of /:"
          curl -s https://yakuzablade.com.tr/ | grep -o '<title>[^<]*</title>' || echo "(no title found)"
          echo "--- redirects:"
          curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}\n' http://yakuzablade.com.tr/ || true
          curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}\n' https://www.yakuzablade.com.tr/ || true
